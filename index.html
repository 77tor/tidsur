<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasserom Tidtaker</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
      color: #333;
      transition: background-color 0.3s;
    }
    
    /* Skjerm-blinking når tiden er ute */
    body.alarm-active {
      animation: flash-red 0.8s infinite alternate;
    }
    @keyframes flash-red {
      0% { background-color: #f0f4f8; }
      100% { background-color: #ff4d4d; }
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 360px;
    }
    h2 { margin-top: 0; color: #2c3e50; }
    .display {
      font-size: 4.5rem;
      font-weight: bold;
      margin: 1rem 0;
      font-family: monospace;
      color: #2c3e50;
    }
    .inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .inputs input {
      width: 70px;
      padding: 8px;
      font-size: 1.1rem;
      text-align: center;
      border: 2px solid #ddd;
      border-radius: 8px;
    }
    .sound-select {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .sound-row {
      display: flex;
      gap: 8px;
      width: 85%;
      justify-content: center;
    }
    .sound-select select {
      padding: 8px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 85%;
    }
    .sound-row select {
      flex-grow: 1;
    }
    .preset-btns, .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 1.2rem;
    }
    button {
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.96); }
    button.start { background-color: #2ecc71; font-size: 1.1rem; padding: 12px 24px; }
    button.start:hover { background-color: #27ae60; }
    button.reset { background-color: #e74c3c; font-size: 1.1rem; padding: 12px 24px; }
    button.reset:hover { background-color: #c0392b; }
    button.preset { background-color: #8e44ad; }
    button.preset:hover { background-color: #732d91; }
    button.test-btn { background-color: #7f8c8d; padding: 8px 12px; }
    button.test-btn:hover { background-color: #95a5a6; }
    button.stop-sound { background-color: #f39c12; }
    button.stop-sound:hover { background-color: #d35400; }

    /* Modal (Pop-up vindu) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 320px;
      width: 90%;
    }
    .modal-content h1 {
      color: #e74c3c;
      margin-top: 0;
      font-size: 2.2rem;
    }
    .modal-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 1.5rem;
    }
    .modal-btns button {
      padding: 14px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Klasserom Tidtaker</h2>
    
    <!-- Standardtider -->
    <div class="preset-btns">
      <button class="preset" onclick="setPreset(2)">2 min</button>
      <button class="preset" onclick="setPreset(5)">5 min</button>
      <button class="preset" onclick="setPreset(7)">7 min</button>
      <button class="preset" onclick="setPreset(10)">10 min</button>
    </div>

    <!-- Valgfri tid -->
    <div class="inputs">
      <input type="number" id="min" placeholder="Min" min="0" value="5">
      <input type="number" id="sec" placeholder="Sek" min="0" max="59" value="0">
    </div>

    <!-- Lydvalg og Avspillingslengde -->
    <div class="sound-select">
      <label for="soundType"><strong>Lyd ved slutt:</strong></label>
      <div class="sound-row">
        <select id="soundType">
          <option value="Lyder/01.mp3">🎬 Filmtrailer</option>
          <option value="Lyder/02.mp3">⏳ Nedtelling</option>
          <option value="Lyder/03.mp3">💓 Hjerteslag</option>
          <option value="Lyder/04.mp3">👾 Game Over</option>
          <option value="Lyder/05.mp3">🎺 Fanfare</option>
          <option value="Lyder/06.mp3">📞 Telefon</option>
        </select>
        <button class="test-btn" onclick="testSound()">▶ Prøv</button>
      </div>

      <label for="soundRepeat"><strong>Hvor mange ganger:</strong></label>
      <select id="soundRepeat">
        <option value="1">1 gang</option>
        <option value="2">2 ganger</option>
        <option value="3">3 ganger</option>
        <option value="loop" selected>Til den slås av</option>
      </select>
    </div>

    <!-- Tidsvisning -->
    <div class="display" id="timerDisplay">05:00</div>

    <!-- Kontrollknapper -->
    <div class="controls">
      <button class="start" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="reset" onclick="resetTimer()">Nullstill</button>
    </div>
  </div>

  <!-- Pop-up Modal ved utløpt tid -->
  <div class="modal-overlay" id="alarmModal">
    <div class="modal-content">
      <h1>⏰ Tiden er ute!</h1>
      <p>Hva vil du gjøre nå?</p>
      <div class="modal-btns">
        <button class="stop-sound" onclick="stopAlarmEffects()">🔕 Stopp alarm</button>
        <button class="start" onclick="restartSameTime()">🔄 Kjør samme tid på nytt</button>
        <button class="reset" onclick="closeModal()">✖ Lukk</button>
      </div>
    </div>
  </div>

  <script>
    let timer = null;
    let totalSeconds = 300;
    let initialSeconds = 300;
    let isRunning = false;
    let currentAudio = null;
    let playCount = 0;

    const display = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');
    const minInput = document.getElementById('min');
    const secInput = document.getElementById('sec');
    const soundTypeSelect = document.getElementById('soundType');
    const soundRepeatSelect = document.getElementById('soundRepeat');
    const modal = document.getElementById('alarmModal');

    function testSound() {
      stopAudio();
      const soundFile = soundTypeSelect.value;
      currentAudio = new Audio(soundFile);
      currentAudio.play().catch(e => alert("Kunne ikke laste filen: " + soundFile + "\nSjekk at filen ligger i mappen 'Lyder'."));
    }

    function playAlarmSound() {
      stopAudio();
      playCount = 0;
      const soundFile = soundTypeSelect.value;
      const repeatVal = soundRepeatSelect.value;

      currentAudio = new Audio(soundFile);

      if (repeatVal === 'loop') {
        currentAudio.loop = true;
      } else {
        const maxRepeats = parseInt(repeatVal);
        currentAudio.addEventListener('ended', function() {
          playCount++;
          if (playCount < maxRepeats) {
            this.currentTime = 0;
            this.play();
          }
        });
      }

      currentAudio.play().catch(e => console.log("Lyd-avspilling blokkert eller fil mangler."));
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    function triggerAlarm() {
      document.body.classList.add('alarm-active');
      modal.style.display = 'flex';
      playAlarmSound();
    }

    function stopAlarmEffects() {
      document.body.classList.remove('alarm-active');
      stopAudio();
    }

    function closeModal() {
      stopAlarmEffects();
      modal.style.display = 'none';
      resetTimer();
    }

    function restartSameTime() {
      stopAlarmEffects();
      modal.style.display = 'none';
      resetTimer();
      startTimer();
    }

    function updateDisplay() {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      display.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function setPreset(minutes) {
      pauseTimer();
      minInput.value = minutes;
      secInput.value = 0;
      applyInputTime();
    }

    function applyInputTime() {
      const m = parseInt(minInput.value) || 0;
      const s = parseInt(secInput.value) || 0;
      totalSeconds = m * 60 + s;
      initialSeconds = totalSeconds;
      updateDisplay();
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (totalSeconds <= 0) applyInputTime();
      if (totalSeconds <= 0) return;

      isRunning = true;
      startBtn.textContent = 'Pause';
      startBtn.style.backgroundColor = '#f39c12';

      timer = setInterval(() => {
        totalSeconds--;
        updateDisplay();

        if (totalSeconds <= 0) {
          clearInterval(timer);
          isRunning = false;
          startBtn.textContent = 'Start';
          startBtn.style.backgroundColor = '#2ecc71';
          triggerAlarm();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
      startBtn.textContent = 'Start';
      startBtn.style.backgroundColor = '#2ecc71';
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = initialSeconds;
      updateDisplay();
    }

    minInput.addEventListener('change', applyInputTime);
    secInput.addEventListener('change', applyInputTime);
  </script>
</body>
</html>
